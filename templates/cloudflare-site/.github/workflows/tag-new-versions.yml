# Adds a version tag (like v1.1.4) whenever a new version of the site reaches main.
# The version comes from APP_VERSION in public/index.html. It uses no outside actions and installs nothing.
name: Tag new versions

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: tag-new-versions
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # only to add the tag
    steps:
      - name: Tag this version if it isn't tagged yet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Read APP_VERSION from public/index.html as it is in this push
          app=$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/public/index.html?ref=$SHA")
          version=$(printf '%s\n' "$app" | grep -oE 'APP_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$version" ]; then
            echo "Couldn't find APP_VERSION in public/index.html, so no tag was added."
            exit 1
          fi
          tag="v$version"
          # gh prints GitHub's "Not Found" reply even when the tag is missing, so go by its exit status, not its output.
          if existing=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            old_type=${existing%% *}
            old=${existing#* }
            # Normally the tag is already in main's history, so there's nothing to do.
            # After a history rewrite (like scrubbing personal info), the old tag points to a commit
            # that's no longer in main. Then the tag moves here, so the old commit isn't kept around.
            if [ "$old_type" != "commit" ]; then
              echo "$tag already exists, so there's nothing to do."
              exit 0
            fi
            if cmp=$(gh api "repos/$REPO/compare/$old...$SHA" --jq '.status' 2>&1); then
              case "$cmp" in
                ahead|identical|behind)
                  echo "$tag already exists, so there's nothing to do."
                  exit 0 ;;
                diverged) ;;
                *) echo "Unexpected answer comparing $tag with this push: $cmp"; exit 1 ;;
              esac
            elif ! printf '%s' "$cmp" | grep -q "No common ancestor"; then
              echo "Couldn't check $tag against this push: $cmp"
              exit 1
            fi
            gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f sha="$SHA" -F force=true --silent
            echo "Moved $tag from $old (no longer in main's history) to $SHA."
            exit 0
          fi
          # Not found: add it. If the tag exists after all, GitHub refuses and the run stops without changing anything.
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" --silent
          echo "Added $tag at $SHA."
